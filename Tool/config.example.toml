# 临时文件存放路径（必须是绝对路径；每次运行前会清空）
temp_dir = "/tmp/clash_rules"

# 输出目录（可选，去重后的产物会在完整生成后统一发布到此目录）
# 如果不设置，.list 文件会保留在 temp_dir 中
output_dir = "/path/to/output"

# 并发下载数（可选，默认为 10）
concurrent_downloads = 20

# 分类定义
# 格式: [categories.分类名]
#       geosite = "CN"                      # 可选
#       geosite_db = "https://.../geosite.dat"  # geosite 配套数据库
#       mem_optimise = true                  # 可选，分别输出 domain/ipcidr MRS
#       urls = ["url1", "url2", ...]

[categories.CN]
geosite = "CN"
geosite_db = "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
urls = [
    "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list",
    "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list",
]

[categories.Advertising]
mem_optimise = true
urls = [
    "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list",
    "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanEasyList.list",
    "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanEasyListChina.list",
]

[categories.Proxy]
urls = [
    "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list",
    "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list",
]

